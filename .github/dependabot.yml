version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # react and react-dom must be the exact same version or React refuses
      # to load ("Incompatible React versions") - a react-only bump (#135)
      # failed every test file. Listed first because Dependabot assigns a
      # dependency to the first group it matches, so the @types packages
      # land here rather than in dev-dependencies.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      dev-dependencies:
        dependency-type: 'development'
    ignore:
      # TS 7 is the tsgo (Go) rewrite; typescript-eslint has no support yet
      # and it's not a quick fix (blocked on an ESLint async-parser
      # limitation - see typescript-eslint/typescript-eslint#10940).
      # Revisit once typescript-eslint ships real tsgo support.
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
